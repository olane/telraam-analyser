[theme]
primaryColor = "#0b6e99"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7fafc"
textColor = "#102027"
font = "sans serif"

[server]
headless = true
address = "0.0.0.0"
port = 8501
# Required when running behind a reverse proxy (Caddy/Traefik).
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
